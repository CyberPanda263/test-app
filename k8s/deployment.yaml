apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: test-app
spec:
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
      - name: backend
        # Використовуємо стабільний тег гілки (main) замість хешів
        image: registry.registry.svc.cluster.local:5000/test-app:main
        imagePullPolicy: Always # <--- Додано, щоб K8s завжди завантажував свіжу версію образу
        ports: [{ containerPort: 3001 }]
        env:
        - name: MONGO_USER
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGO_INITDB_ROOT_PASSWORD
        - name: MONGO_URI
          value: "mongodb://$(MONGO_USER):$(MONGO_PASS)@mongodb-service:27017/testdb?authSource=admin"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3