apiVersion: v1
kind: Namespace
metadata:
  name: test-app
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: test-app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: "admin"
  MONGO_INITDB_ROOT_PASSWORD: "supersecretpassword123"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: test-app
  annotations:
    argocd.argoproj.io/sync-wave: "0" # <--- Виправлено: тепер створюється разом з Pod'ом
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  namespace: test-app
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector: { matchLabels: { app: mongodb } }
  template:
    metadata: { labels: { app: mongodb } }
    spec:
      containers:
      - name: mongodb
        image: mongo:4.4
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom: { secretKeyRef: { name: mongodb-secret, key: MONGO_INITDB_ROOT_USERNAME } }
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: mongodb-secret, key: MONGO_INITDB_ROOT_PASSWORD } }
        ports: [{ containerPort: 27017 }]
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        persistentVolumeClaim:
          claimName: mongodb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: test-app
  annotations:
    argocd.argoproj.io/sync-wave: "0" 
spec:
  selector: { app: mongodb }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: test-app
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector: { app: backend }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: test-app
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Ігноруємо розбіжності в статусі, щоб ArgoCD не показував помилку OutOfSync
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    # Базові налаштування для Nginx Ingress
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  rules:
  - host: test-app.barbariska.fun
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 3001